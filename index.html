<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel Grand Prix V4</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;font-family:monospace;touch-action:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let W=innerWidth,H=innerHeight,D=1;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}resize();addEventListener("resize",resize);

const drivers=[
 ["Hamzah","#f04435"],["MT","#2787e8"],["Abdul","#ffd43b"],["Uwais","#a94eea"],["Abu","#27c96f"]
];

let player={lane:0,speed:0,distance:0,boost:100};
let bots=drivers.slice(1).map((d,i)=>({lane:i-1.5,progress:.08+i*.045,speed:.0031+i*.00012}));

// KEYBOARD
const keys={};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.code==="Space")e.preventDefault()});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});

// TOUCH CONTROLS
const joy={cx:92,cy:0,r:72,x:0,y:0,active:false,pointerId:null};
let boostHeld=false;

function resetJoy(){joy.active=false;joy.pointerId=null;joy.x=0;joy.y=0}
function updateJoy(e){
  const r=c.getBoundingClientRect();
  const px=e.clientX-r.left, py=e.clientY-r.top;
  // The joystick stays in the bottom-left. You can drag it in ANY direction,
  // including upward outside the original joystick circle.
  const dx=px-joy.cx, dy=py-joy.cy;
  const len=Math.hypot(dx,dy)||1;
  const max=joy.r*.72;
  const k=Math.min(1,max/len);
  joy.x=(dx*k)/max;
  joy.y=(dy*k)/max;
}
c.addEventListener("pointerdown",e=>{
  const r=c.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  const boostX=W-88,boostY=H-92;
  if(Math.hypot(px-boostX,py-boostY)<75){boostHeld=true;return}
  if(Math.hypot(px-joy.cx,py-joy.cy)<95){
    joy.active=true;joy.pointerId=e.pointerId;updateJoy(e);
    c.setPointerCapture?.(e.pointerId);
  }
});
c.addEventListener("pointermove",e=>{if(joy.active&&e.pointerId===joy.pointerId)updateJoy(e)});
c.addEventListener("pointerup",e=>{if(e.pointerId===joy.pointerId)resetJoy();boostHeld=false});
c.addEventListener("pointercancel",e=>{if(e.pointerId===joy.pointerId)resetJoy();boostHeld=false});

function road(z){
  return {y:H*.37+z*z*H*.63,half:W*(.11+.40*z)};
}
function roadX(lane,z){return W/2+lane*road(z).half*.46}

function background(){
  ctx.fillStyle="#8fc8e8";ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H*.45);
  g.addColorStop(0,"#555c86");g.addColorStop(1,"#e5a071");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H*.42);
  ctx.fillStyle="#40565a";ctx.beginPath();
  ctx.moveTo(0,H*.39);ctx.lineTo(W*.18,H*.28);ctx.lineTo(W*.34,H*.37);
  ctx.lineTo(W*.54,H*.26);ctx.lineTo(W*.73,H*.36);ctx.lineTo(W,H*.27);
  ctx.lineTo(W,H*.43);ctx.lineTo(0,H*.43);ctx.fill();
  ctx.fillStyle="#399447";ctx.fillRect(0,H*.38,W,H*.62);
}

function track(){
  ctx.fillStyle="#292d31";ctx.beginPath();
  ctx.moveTo(W*.39,H*.37);ctx.lineTo(W*.61,H*.37);ctx.lineTo(W*.98,H);ctx.lineTo(W*.02,H);ctx.closePath();ctx.fill();

  // white/red curbs
  for(let side of [-1,1]){
    ctx.fillStyle="#f2f2f2";ctx.beginPath();
    ctx.moveTo(W/2+side*W*.375,H*.37);ctx.lineTo(W/2+side*W*.39,H*.37);
    ctx.lineTo(W/2+side*W*.50,H);ctx.lineTo(W/2+side*W*.48,H);ctx.closePath();ctx.fill();
  }
  for(let i=0;i<13;i++){
    let z=((i/13+player.distance*1.4)%1),r=road(z),y=r.y,b=5+z*9;
    ctx.fillStyle="#e53935";
    ctx.fillRect(W/2-r.half-2,y,b,Math.max(10,24*z));
    ctx.fillRect(W/2+r.half-3,y,b,Math.max(10,24*z));
  }

  // lane markers move as the player drives
  ctx.fillStyle="#ddd";
  for(let i=0;i<12;i++){
    let z=((i/12+player.distance*2.2)%1),r=road(z),dash=Math.max(3,7*z);
    ctx.fillRect(W/2-r.half*.33-dash/2,r.y,dash,Math.max(4,14*z));
    ctx.fillRect(W/2+r.half*.33-dash/2,r.y,dash,Math.max(4,14*z));
  }

  // start/finish line
  let z=.77,r=road(z);
  for(let i=0;i<18;i++){
    ctx.fillStyle=i%2?"#222":"#fff";
    ctx.fillRect(W/2-r.half*.92+i*(r.half*1.84/18),r.y,r.half*1.84/18,10);
  }
}

function stands(){
  for(let side of [-1,1]){
    for(let i=0;i<11;i++){
      let z=((i/11+player.distance*1.15)%1),r=road(z),y=r.y;
      let x=W/2+side*(r.half+30+z*50),s=10+z*31;
      ctx.fillStyle="#41474c";ctx.fillRect(x-side*s,y-s*.95,s,s*.7);
      for(let q=0;q<5;q++){
        ctx.fillStyle=drivers[(i+q)%5][1];
        ctx.fillRect(x-side*(s-2-q*3),y-s*.82,4,4);
      }
    }
  }
}

function car(px,py,color,name,scale,tilt){
  ctx.save();ctx.translate(px,py);ctx.rotate(tilt||0);ctx.scale(scale,scale);
  ctx.fillStyle="#0d1115";ctx.fillRect(-29,-9,58,18);
  ctx.fillStyle=color;ctx.fillRect(-26,-8,50,14);ctx.fillRect(-13,-12,28,7);
  ctx.fillStyle="#b9e5f7";ctx.fillRect(-6,-11,15,6);
  ctx.fillStyle="#111";ctx.fillRect(-24,6,10,7);ctx.fillRect(14,6,10,7);
  ctx.fillStyle="#fff";ctx.fillRect(8,-4,11,3);
  ctx.restore();
  ctx.fillStyle="#fff";ctx.font=Math.max(9,10*scale)+"px monospace";
  ctx.textAlign="center";ctx.fillText(name,px,py-24*scale);
}

function update(){
  // Joystick UP = gas, LEFT/RIGHT = steering.
  let sx=joy.active?joy.x:((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0);
  let gas=joy.active?Math.max(0,-joy.y):((keys.w||keys.arrowup)?1:0);

  player.lane+=sx*.018;
  player.lane=Math.max(-1.32,Math.min(1.32,player.lane));

  // Always accelerate gently; pushing up makes it much faster.
  player.speed += .00032 + gas*.0042;
  player.speed *= .985;

  if(boostHeld && player.boost>0){
    player.speed+=.006;
    player.boost-=.9;
  }else{
    player.boost=Math.min(100,player.boost+.25);
  }

  player.speed=Math.max(0,Math.min(.028,player.speed));
  player.distance+=player.speed;

  bots.forEach(b=>{b.progress+=b.speed});
}

function draw(){
  background();stands();track();

  // Opponents move toward and away from the camera.
  bots.forEach((b,i)=>{
    let rel=b.progress-player.distance;
    rel=((rel%1)+1)%1;
    let z=.18+rel*.67;
    let r=road(z);
    car(roadX(b.lane,z),r.y-12,drivers[i+1][1],drivers[i+1][0],.43+.86*z,0);
  });

  car(roadX(player.lane,.87),H*.82,drivers[0][1],"Hamzah",1.45,player.lane*.025);

  // HUD
  ctx.fillStyle="#000b";ctx.fillRect(12,12,220,82);
  ctx.fillStyle="#fff";ctx.font="bold 13px monospace";ctx.textAlign="left";
  ctx.fillText("PIXEL GRAND PRIX",22,32);
  ctx.fillText("HAMZAH  •  LAP "+(Math.floor(player.distance/3)%3+1)+"/3",22,52);
  ctx.fillText("SPEED "+Math.round(player.speed*3600),22,72);

  // joystick
  ctx.globalAlpha=.78;
  ctx.fillStyle="#17191d";ctx.beginPath();ctx.arc(joy.cx,H-92,72,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#aaa";ctx.beginPath();
  ctx.arc(joy.cx+joy.x*48,H-92+joy.y*48,28,0,Math.PI*2);ctx.fill();

  // boost
  ctx.fillStyle="#ff8b00";ctx.beginPath();ctx.arc(W-88,H-92,67,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;ctx.fillStyle="#fff";ctx.font="bold 14px monospace";ctx.textAlign="center";
  ctx.fillText("BOOST",W-88,H-88);ctx.font="11px monospace";ctx.fillText(Math.floor(player.boost)+"%",W-88,H-68);

  // boost bar
  ctx.fillStyle="#222";ctx.fillRect(12,H-25,180,10);
  ctx.fillStyle="#ffc400";ctx.fillRect(12,H-25,180*player.boost/100,10);

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
